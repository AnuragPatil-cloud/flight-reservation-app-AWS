apiVersion: v1
kind: ConfigMap
metadata:
  name: flight-reservation-config
  namespace: flight-reservation
data:
  # Replace <RDS_ENDPOINT> with the terraform output for the RDS endpoint
  # (flight-reservation-dev-rds). Same host, two logical databases.
  SPRING_DATASOURCE_URL_RESERVATION: "jdbc:mysql://flight-reservation-dev-rds.c7qw8u2wyu61.ap-south-1.rds.amazonaws.com:3306/checkin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
  SPRING_DATASOURCE_URL_CHECKIN: "jdbc:mysql://flight-reservation-dev-rds.c7qw8u2wyu61.ap-south-1.rds.amazonaws.com:3306/checkin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
  # In-cluster service DNS - no change needed between environments.
  BOOKING_SERVICE_URL: "http://flight-reservation-service:8080/api/bookings"
  # Replace once the frontend LoadBalancer/ingress address is known.
  FRONTEND_URL: "http://af91d514b2c874471ad4b1a8f39460e6-43260753.ap-south-1.elb.amazonaws.com "
